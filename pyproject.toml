[project]
name = "legal-ai-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rakshitsingh25", email = "rakshitrak21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.53.0",
    "pageindex>=0.2.8",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.7.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
legal_ai_app = "legal_ai_app.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
